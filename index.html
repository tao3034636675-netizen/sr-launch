<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>小火箭 Safari 一键导入桥</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0d12;
        --card: #151923;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f5f7fa;
        --dim: #9aa3b2;
        --blue: #0a84ff;
        --green: #30d158;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f5f7;
          --card: #ffffff;
          --border: rgba(15, 23, 42, 0.1);
          --text: #1d1d1f;
          --dim: #6e6e73;
          --blue: #007aff;
          --green: #16a34a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 24px 20px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.25);
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        color: var(--green);
        background: rgba(48, 209, 88, 0.14);
        margin-bottom: 12px;
      }
      h1 { margin: 0 0 6px; font-size: 20px; line-height: 1.3; }
      p { margin: 0 0 16px; font-size: 13px; color: var(--dim); line-height: 1.55; }
      .btn {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 15px;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .btn-primary { background: var(--blue); color: #fff; }
      .btn-soft { background: transparent; color: var(--text); border: 1px solid var(--border); }
      .url-box {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--dim);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        margin-top: 8px;
      }
      .tip {
        margin-top: 14px;
        font-size: 12px;
        color: var(--dim);
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">零密码纯 HTTPS · Safari 一键桥</div>
      <h1 id="title">正在拉起 Shadowrocket…</h1>
      <p id="desc">若系统未自动弹出「在 Shadowrocket 中打开」，请点击下方蓝色按钮（或点右上角「在 Safari 中打开」）。</p>
      <a id="launchBtn" class="btn btn-primary" href="#">打开小火箭继续安装</a>
      <button id="copyBtn" class="btn btn-soft" type="button">复制原始链接（小火箭内手动粘贴）</button>
      <a id="rawBtn" class="btn btn-soft" href="#" target="_blank" rel="noopener noreferrer">在浏览器查看源文件</a>
      <input id="urlBox" class="url-box" type="text" readonly />
      <div id="tip" class="tip"></div>
    </main>
    <script>
      (function () {
        var sp = new URLSearchParams(window.location.search);
        var mode = sp.get("mode") === "module" ? "module" : "config";
        var rawUrl = (sp.get("url") || "").trim();
        var title = (sp.get("title") || (mode === "module" ? "小火箭去广告模块" : "la-vip.conf v4 规则")).slice(0, 60);

        var titleEl = document.getElementById("title");
        var descEl = document.getElementById("desc");
        var launchBtn = document.getElementById("launchBtn");
        var copyBtn = document.getElementById("copyBtn");
        var rawBtn = document.getElementById("rawBtn");
        var urlBox = document.getElementById("urlBox");
        var tipEl = document.getElementById("tip");

        var safe =
          rawUrl.indexOf("https://") === 0 &&
          rawUrl.indexOf("@") === -1 &&
          !/[?&](password|token|key|secret|auth)=/i.test(rawUrl);

        if (!safe) {
          titleEl.textContent = "等待来自「网络中枢」的导入链接";
          descEl.textContent = "请从 Muse「网络中枢 → 小火箭」页面点击一键导入或模块安装按钮进入本页（仅支持纯公网零密码 https:// 链接）。";
          launchBtn.style.display = "none";
          copyBtn.style.display = "none";
          rawBtn.style.display = "none";
          urlBox.style.display = "none";
          return;
        }

        // Shadowrocket config/add takes raw unencoded URL; install?module takes encoded query param
        var deepLink =
          mode === "module"
            ? "shadowrocket://install?module=" + encodeURIComponent(rawUrl)
            : "shadowrocket://config/add/" + rawUrl;

        titleEl.textContent = "导入：" + title;
        launchBtn.href = deepLink;
        rawBtn.href = rawUrl;
        urlBox.value = rawUrl;
        tipEl.textContent =
          mode === "module"
            ? "手动兜底：打开小火箭 → 配置 → 模块 → 右上角 + → 粘贴链接 → 下载并勾选。"
            : "手动兜底：打开小火箭 → 配置 → 右上角 + → 粘贴链接 → 下载 → 选「使用配置」。";

        urlBox.addEventListener("click", function () { urlBox.select(); });
        copyBtn.addEventListener("click", function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(rawUrl).then(function () {
              copyBtn.textContent = "已复制直链，去小火箭粘贴即可";
            }).catch(function () {
              urlBox.select();
              document.execCommand("copy");
              copyBtn.textContent = "已复制直链，去小火箭粘贴即可";
            });
          } else {
            urlBox.select();
            document.execCommand("copy");
            copyBtn.textContent = "已复制直链，去小火箭粘贴即可";
          }
        });

        // Auto-attempt Shadowrocket launch right after page paint
        setTimeout(function () {
          window.location.href = deepLink;
        }, 250);
      })();
    </script>
  </body>
</html>
